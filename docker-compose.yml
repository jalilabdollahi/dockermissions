# Optional: run backend + frontend in containers instead of ./start.sh.
# The backend drives the host's Docker to manage the isolated `dockermissions-sandbox`
# container. Because that sandbox bind-mounts the session directory from the HOST,
# SESSION_ROOT_HOST must be the absolute host path of ./tmp/sessions:
#
#   SESSION_ROOT_HOST="$PWD/tmp/sessions" docker compose up --build
services:
  backend:
    build: ./backend
    command: npm run dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./docker/sandbox:/sandbox-build:ro
      - ./tmp:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      FRONTEND_ORIGIN: http://localhost:5173
      SESSION_ROOT: /data/sessions
      SESSION_ROOT_HOST: ${SESSION_ROOT_HOST:?set SESSION_ROOT_HOST to the absolute path of ./tmp/sessions}
      DATA_DIR: /data/data
      SANDBOX_BUILD_DIR: /sandbox-build

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      BACKEND_URL: http://backend:3001
    depends_on:
      - backend
